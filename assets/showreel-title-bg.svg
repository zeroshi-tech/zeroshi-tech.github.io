<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 1000 315">
<style>
.b1{animation:k1 .75s linear infinite}.b2{animation:k2 .75s linear infinite}.b3{animation:k3 .75s linear infinite}
.wob{transform-origin:500px 180px;animation:wob 1.5s steps(1) infinite}
@keyframes k1{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
@keyframes k2{0%,33.3%{opacity:0}33.4%,66.6%{opacity:1}66.7%,100%{opacity:0}}
@keyframes k3{0%,66.6%{opacity:0}66.7%,100%{opacity:1}}
@keyframes wob{0%{transform:none}25%{transform:translate(1px,-1px) rotate(.25deg)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px) rotate(-.25deg)}}
@media (prefers-reduced-motion:reduce){.b1,.b2,.b3,.wob{animation:none}.b2,.b3{opacity:0}}
</style>
<defs>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><circle cx="2.5" cy="2.5" r="1" fill="#0a2c8f" opacity=".55"/></pattern>
<pattern id="dotsY" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#ffe03a" opacity=".7"/></pattern>
<clipPath id="bclip"><path d="M62,292 L118,214 L92,118 L600,104 L880,74 L958,38 L922,150 L946,236 L560,246 L128,266Z"/></clipPath>
<filter id="rough" x="-5%" y="-10%" width="110%" height="120%">
<feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="4" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="grime" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="9"/>
<feColorMatrix values="0 0 0 0 .04  0 0 0 0 .04  0 0 0 0 .14  0 0 0 -2.6 1.45"/>
</filter>
<filter id="stain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="4" seed="21"/>
<feColorMatrix values="0 0 0 0 .2  0 0 0 0 .08  0 0 0 0 .55  0 0 0 -3.2 1.75"/>
</filter>
<filter id="paint" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".02 .05" numOctaves="4" seed="33"/>
<feColorMatrix values="0 0 0 0 .95  0 0 0 0 .97  0 0 0 0 1  0 0 0 4 -2.55"/>
</filter>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
