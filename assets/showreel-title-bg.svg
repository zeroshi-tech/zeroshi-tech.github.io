<style>
.b1{animation:k1 .75s linear infinite}.b2{animation:k2 .75s linear infinite}.b3{animation:k3 .75s linear infinite}
.wob{transform-origin:500px 180px;animation:wob 1.5s steps(1) infinite}
@keyframes k1{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
@keyframes k2{0%,33.3%{opacity:0}33.4%,66.6%{opacity:1}66.7%,100%{opacity:0}}
@keyframes k3{0%,66.6%{opacity:0}66.7%,100%{opacity:1}}
@keyframes wob{0%{transform:none}25%{transform:translate(1px,-1px) rotate(.25deg)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px) rotate(-.25deg)}}
@media (prefers-reduced-motion:reduce){.b1,.b2,.b3,.wob{animation:none}.b2,.b3{opacity:0}}
</style>
